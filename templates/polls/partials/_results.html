<div class="results" data-total="{{ total_votes }}">
  {% if total_votes == 0 %}<p class="results__empty">Henüz oy yok</p>{% endif %}
  <ul class="options">
    {% for r in results %}
      <li class="result option--{{ r.order|add:1 }}">
        <div class="result__head">
          <span class="result__text">{{ r.text }}</span>
          <span class="result__badges">
            {% if r.is_mine %}<span class="badge badge--mine">Senin seçimin ✓</span>{% endif %}
            {% if r.is_leading %}<span class="badge badge--lead">👑 Önde</span>{% endif %}
          </span>
        </div>
        <div class="result__bar" role="img" aria-label="{{ r.text }}: %{{ r.percent }}">
          <div class="result__fill" style="width: {{ r.percent }}%"></div>
        </div>
        <div class="result__numbers"><strong>%{{ r.percent }}</strong> · {{ r.votes }} oy</div>
      </li>
    {% endfor %}
  </ul>
  <p class="results__total">Toplam {{ total_votes }} oy</p>
</div>
