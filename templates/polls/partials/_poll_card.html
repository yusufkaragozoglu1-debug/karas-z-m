<article class="card poll-card">
  <h2 class="poll-card__question"><a href="{% url 'poll_detail' poll.pk %}">{{ poll.question }}</a></h2>
  <p class="poll-card__meta">
    <span>@{{ poll.author.username }}</span> ·
    <span>{{ poll.created_at|timesince }} önce</span>
  </p>
  <p class="poll-card__stats">
    <span class="badge">{{ poll.option_count }} seçenek</span>
    <span class="badge">{{ poll.total_votes }} oy</span>
  </p>
</article>
