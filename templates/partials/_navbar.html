{% load static %}
<header class="navbar">
  <div class="container navbar__inner">
    <a class="navbar__brand" href="{% url 'poll_list' %}">
      <img src="{% static 'img/logo.svg' %}" alt="" width="32" height="32">
      <span>Kararsızım</span>
    </a>
    <button type="button" class="navbar__toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Menüyü aç/kapat">
      <span aria-hidden="true">☰</span>
    </button>
    <nav class="navbar__links" id="nav-links" aria-label="Ana menü">
      {% if user.is_authenticated %}
        <a class="navbar__link" href="{% url 'poll_create' %}">Anket oluştur</a>
        <a class="navbar__link" href="{% url 'my_polls' %}">Anketlerim</a>
        <span class="navbar__user">@{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="navbar__form">
          {% csrf_token %}
          <button type="submit" class="btn btn--ghost btn--small">Çıkış</button>
        </form>
      {% else %}
        <a class="btn btn--ghost btn--small" href="{% url 'login' %}">Giriş</a>
        <a class="btn btn--primary btn--small" href="{% url 'signup' %}">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
